services:
  - type: web
    name: ai-education-frontend
    runtime: static
    staticPublishPath: build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: ai-education-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    buildFilter:
      paths:
        - backend/**
    healthCheckPath: /health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY, value: "1" }
      - { key: DATABASE_URL, sync: false }
      - { key: AUTH_CODE_SECRET, sync: false }
      - { key: AI_INTERNAL_KEY, sync: false }
      - { key: AI_SERVICE_URL, sync: false }   # https://<ai-service>.onrender.com
      - { key: MAIL_MODE, sync: false }
      - { key: MAIL_FROM, sync: false }
      - { key: RESEND_API_KEY, sync: false }

  - type: web
    name: course-service
    runtime: node
    rootDir: course-service
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    buildFilter:
      paths:
        - course-service/**
    healthCheckPath: /health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY, value: "1" }
      - { key: DATABASE_URL, sync: false }

  - type: web
    name: ai-service
    runtime: node
    rootDir: ai-service
    buildCommand: npm install
    startCommand: npm start
    buildFilter:
      paths:
        - ai-service/**
    healthCheckPath: /health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: NODE_VERSION, value: "22" }
      - { key: HOST, value: "0.0.0.0" }
      - { key: INTERNAL_API_KEY, sync: false }   # must equal backend AI_INTERNAL_KEY
      - { key: GEMINI_API_KEY, sync: false }
