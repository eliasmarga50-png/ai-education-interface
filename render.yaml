services:
  - type: web
    name: ai-education-frontend
    env: static
    staticPublishPath: build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: ai-education-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    buildFilter:
      paths:
        - backend/**
    healthCheckPath: /health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY, value: "1" }
      - { key: DATABASE_URL, sync: false }
      - { key: AUTH_CODE_SECRET, sync: false }
      - { key: AI_INTERNAL_KEY, sync: false }
      - { key: AI_SERVICE_URL, sync: false }
      - { key: MAIL_MODE, sync: false }
      - { key: MAIL_FROM, sync: false }
      - { key: RESEND_API_KEY, sync: false }

  - type: web
    name: course-service
    env: node
    plan: free
    rootDir: course-service
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    buildFilter:
      paths:
        - course-service/**
    healthCheckPath: /health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY, value: "1" }
      - { key: DATABASE_URL, sync: false }

  - type: web
    name: ai-service
    env: node
    plan: free
    rootDir: ai-service
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    buildFilter:
      paths:
        - ai-service/**
    healthCheckPath: /health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: NODE_VERSION, value: "22" }
      - { key: HOST, value: "0.0.0.0" }
      - { key: INTERNAL_API_KEY, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
